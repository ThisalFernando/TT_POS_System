<script>
(() => {
'use strict';

/* ==========================================================================
   1. CONSTANTS, STORAGE LAYER
   ========================================================================== */
const KEYS = ['companySettings','products','categories','sales','invoices','invoiceCounter','reports','theme'];

const DEFAULT_SETTINGS = {
  name: 'THILAK TAILORS',
  address: '517/1/A, Heenkenda, Ragama',
  phone: '0715740671',
  logo: '',
  currency: 'LKR',
  taxRate: 0,
  footer: 'Thank You, Come Again!...',
  receiptSize: '80mm',
  invoicePrefix: 'INV-',
  cashier: 'Admin'
};

const Store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { UI.toast('Browser storage is full. Export a backup and remove old data or images.', 'error'); return false; }
  }
};

/* ==========================================================================
   2. APPLICATION STATE
   ========================================================================== */
const S = {
  settings: { ...DEFAULT_SETTINGS },
  products: [], categories: [], sales: [], invoices: [], counter: 1, reports: {}, theme: 'light',
  view: 'dashboard',
  cart: [], discount: { value: 0, type: 'amount' }, cash: '',
  posSearch: '', posCat: 'all',
  prodSearch: '', prodCat: 'all',
  salesFilter: { inv: '', date: '', product: '' },
  period: 'today',
  receipt: null,
  tempImage: '',
  confirmResolve: null
};

const persist = {
  settings: () => Store.set('companySettings', S.settings),
  products: () => Store.set('products', S.products),
  categories: () => Store.set('categories', S.categories),
  sales: () => Store.set('sales', S.sales),
  invoices: () => Store.set('invoices', S.invoices),
  counter: () => Store.set('invoiceCounter', S.counter),
  reports: () => Store.set('reports', S.reports),
  theme: () => Store.set('theme', S.theme),
  cart: () => Store.set('cart', S.cart)
};

/* ==========================================================================
   3. HELPERS
   ========================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const fmtN = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = (n) => `${S.settings.currency} ${fmtN(n)}`;
const pad = (n) => String(n).padStart(2, '0');
const dateKey = (d) => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = (d) => new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtTime = (d) => new Date(d).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
const isLow = (p) => !p.service && p.stock <= p.low;
const debounce = (fn, ms = 120) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const nextInvoice = () => `${S.settings.invoicePrefix}${String(S.counter).padStart(5, '0')}`;

/* ==========================================================================
   4. DESIGN TOKENS (Tailwind utility strings only - no custom CSS)
   ========================================================================== */
const C = {
  card: 'rounded-3xl border border-white/50 bg-white/70 p-5 shadow-lg shadow-blue-900/5 backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/60',
  btn: 'inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-95 disabled:opacity-50',
  primary: 'bg-blue-900 text-white hover:bg-blue-800 dark:bg-blue-600 dark:hover:bg-blue-500',
  ghost: 'bg-slate-200/70 text-slate-800 hover:bg-slate-300/80 dark:bg-slate-800 dark:text-slate-100 dark:hover:bg-slate-700',

  openModal(html, width = 'max-w-lg') {

/* ==========================================================================
   6. DOMAIN LOGIC: REPORT AGGREGATES, STATS, CART MATH
   ========================================================================== */
const Domain = {
  rebuildReports() {
    const days = {};
    S.sales.forEach((s) => {
      const k = dateKey(s.date);
      const d = days[k] || (days[k] = { revenue: 0, profit: 0, orders: 0, items: 0 });
      d.revenue = r2(d.revenue + s.total); d.profit = r2(d.profit + s.profit); d.orders += 1;
      d.items += s.items.reduce((a, i) => a + i.qty, 0);
    });
    S.reports = days; persist.reports();
  },

  productStats(sales) {
    const m = new Map();
    sales.forEach((s) => s.items.forEach((i) => {
      const e = m.get(i.id) || { id: i.id, name: i.name, category: i.category, qty: 0, revenue: 0 };
      e.qty += i.qty; e.revenue = r2(e.revenue + i.qty * i.price); m.set(i.id, e);
    }));
    return [...m.values()];
  },

  inPeriod(date, period) {
    const k = dateKey(date), today = dateKey(new Date());
    if (period === 'today') return k === today;
    if (period === 'week') { const from = new Date(); from.setDate(from.getDate() - 6); return k >= dateKey(from) && k <= today; }
    return k.slice(0, 7) === today.slice(0, 7);
  },

  totals() {
    const subtotal = r2(S.cart.reduce((a, l) => a + l.qty * l.price, 0));
    let disc = S.discount.type === 'percent' ? subtotal * S.discount.value / 100 : S.discount.value;
    disc = r2(Math.min(Math.max(disc, 0), subtotal));
    const taxable = r2(subtotal - disc);
    const tax = r2(taxable * S.settings.taxRate / 100);
    const total = r2(taxable + tax);
    const cash = S.cash === '' ? total : num(S.cash);
    const profit = r2(S.cart.reduce((a, l) => a + l.qty * (l.price - l.cost), 0) - disc);
    return { subtotal, discount: disc, tax, total, cash, balance: r2(cash - total), profit };
  },

  adjustStock(items, direction) {
    items.forEach((i) => {
      const p = S.products.find((x) => x.id === i.id);
      if (p && !p.service) p.stock = Math.max(0, p.stock + direction * i.qty);
    });
    persist.products();
  }
};

const barcodeSVG = (text) => {
  let x = 0, rects = '';
  for (const ch of `*${text}*`) {
    for (const bit of ch.charCodeAt(0).toString(2).padStart(8, '0')) {
      if (bit === '1') rects += `<rect x="${x}" y="0" width="1" height="30"/>`;
      x += 1;
    }
    x += 2;
  }
  return `<svg viewBox="0 0 ${x} 30" preserveAspectRatio="none" class="mx-auto h-8 w-44 fill-black">${rects}</svg>`;
};

function receiptHTML(sale, size) {

  const line = (label, val, strong) => `<div class="flex justify-between ${strong ? 'text-base font-bold' : ''}"><span>${label}</span><span>${val}</span></div>`;

  const items = a4
    ? `<table class="my-3 w-full"><thead><tr class="border-b-2 border-black text-left"><th class="py-1.5">Item</th><th class="py-1.5 text-right">Qty</th><th class="py-1.5 text-right">Price</th><th class="py-1.5 text-right">Total</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="my-2 border-y border-dashed border-black py-2">${rows}</div>`;
  return `
  <div class="mx-auto bg-white font-mono text-black ${box}">
    <div class="text-center">
      ${st.logo ? `<img src="${st.logo}" alt="" class="mx-auto mb-1 ${a4 ? 'h-20' : 'h-12'} object-contain">` : ''}
      <div class="${a4 ? 'text-2xl' : 'text-sm'} font-bold">${esc(st.name)}</div>
      <div>${esc(st.address)}</div>
      <div>Tel: ${esc(st.phone)}</div>

      ${line('Date', fmtDate(sale.date))}
      ${line('Time', fmtTime(sale.date))}
      ${line('Cashier', esc(sale.cashier))}
    </div>
    ${items}
    ${line('Subtotal', fmtN(sale.subtotal))}
    ${sale.discount > 0 ? line('Discount', '-' + fmtN(sale.discount)) : ''}
    ${sale.tax > 0 ? line(`Tax (${sale.taxRate}%)`, fmtN(sale.tax)) : ''}
    <div class="my-1 border-y border-black py-1">${line(`Grand Total (${esc(sale.currency)})`, fmtN(sale.total), true)}</div>
    ${line('Cash', fmtN(sale.cash))}
    ${line('Balance', fmtN(sale.balance))}
    <div class="mt-3 text-center">

/* ==========================================================================
   7b. PDF INVOICE GENERATOR (pure JS, no libraries, works offline)
   Writes a real PDF using the built-in Courier fonts and an optional JPEG logo.
   ========================================================================== */
const Pdf = {
  clean: (v) => String(v ?? '').replace(/\u00d7/g, 'x').replace(/[^\x20-\x7E]/g, '?'),
  esc: (v) => v.replace(/[\\()]/g, (c) => '\\' + c),

  /* Convert the stored logo to a JPEG byte array (PDF DCTDecode) */
  logoJpeg(url, max = 300) {
    return new Promise((resolve) => {
      if (!url) return resolve(null);
      const img = new Image();
      img.onerror = () => resolve(null);
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        const bin = atob(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
        const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve({ w: c.width, h: c.height, bytes });
      };
      img.src = url;
    });
  },

  /* Lay out the receipt as drawing operations measured from the top of the page */
  layout(sale, size, logo) {
    const st = S.settings, a4 = size === 'A4';
    const W = { '58mm': 164.4, '80mm': 226.8, 'A4': 595.28 }[size] || 226.8;
    const M = { '58mm': 8, '80mm': 10, 'A4': 42 }[size] || 10;
    const fs = { '58mm': 7.5, '80mm': 9, 'A4': 11 }[size] || 9;
    const PAGE_H = 841.89, lh = fs * 1.4, cw = fs * 0.6, cols = Math.floor((W - 2 * M) / cw);
    const pages = [[]]; let top = M;
    const ops = () => pages[pages.length - 1];
    const need = (h) => { if (a4 && top + h > PAGE_H - M) { pages.push([]); top = M; } };
    const put = (s, x, o = {}) => {
      const size_ = o.size || fs, t = Pdf.clean(s), w = t.length * size_ * 0.6;
      const xx = o.align === 'c' ? W / 2 - w / 2 : o.align === 'r' ? x - w : x;
      ops().push({ k: 't', x: xx, y: top + size_ * 0.85, s: t, size: size_, bold: !!o.bold });
    };
    const wrap = (s, n) => {
      const out = []; let cur = '';
      Pdf.clean(s).split(' ').forEach((word) => {
        while (word.length > n) { if (cur) { out.push(cur); cur = ''; } out.push(word.slice(0, n)); word = word.slice(n); }
        if ((cur + ' ' + word).trim().length > n) { out.push(cur); cur = word; } else cur = (cur + ' ' + word).trim();
      });
      if (cur) out.push(cur); return out.length ? out : [''];
    };
    const center = (s, o = {}) => { const size_ = o.size || fs; wrap(s, Math.floor((W - 2 * M) / (size_ * 0.6))).forEach((l) => { need(size_ * 1.4); put(l, 0, { ...o, align: 'c' }); top += size_ * 1.4; }); };
    const row = (l, r, o = {}) => { need(lh); put(l, M, o); put(r, W - M, { ...o, align: 'r' }); top += (o.size || fs) * 1.4; };
    const rule = (dash = true) => { need(lh); top += lh * 0.3; ops().push({ k: 'l', x1: M, x2: W - M, y: top, dash, w: dash ? 0.5 : 0.9 }); top += lh * 0.6; };

    // Header
    if (logo) {
      const maxH = a4 ? 60 : 36, sc = Math.min(maxH / logo.h, (W - 2 * M) / logo.w), w = logo.w * sc, h = logo.h * sc;
      ops().push({ k: 'i', x: W / 2 - w / 2, y: top, w, h }); top += h + 4;
    }
    center(st.name, { bold: true, size: a4 ? 18 : fs + 2.5 });
    center(st.address); center(`Tel: ${st.phone}`);
    rule();
    row('Invoice', sale.invoice); row('Date', fmtDate(sale.date)); row('Time', fmtTime(sale.date)); row('Cashier', sale.cashier);
    rule();

    // Items
    if (a4) {
      const totalR = W - M, priceR = W - M - 110, qtyR = W - M - 220, nameCols = Math.floor((qtyR - 30 - M) / cw);
      need(lh); put('Item', M, { bold: true }); put('Qty', qtyR, { bold: true, align: 'r' }); put('Price', priceR, { bold: true, align: 'r' }); put('Total', totalR, { bold: true, align: 'r' }); top += lh;
      rule(false);
      sale.items.forEach((i) => {
        wrap(i.name, nameCols).forEach((l, idx) => {
          need(lh); put(l, M);
          if (idx === 0) { put(String(i.qty), qtyR, { align: 'r' }); put(fmtN(i.price), priceR, { align: 'r' }); put(fmtN(i.qty * i.price), totalR, { align: 'r' }); }
          top += lh;
        });
        top += 2;
      });
    } else {
      sale.items.forEach((i) => {
        wrap(i.name, cols).forEach((l) => { need(lh); put(l, M, { bold: true }); top += lh; });
        row(`${i.qty} x ${fmtN(i.price)}`, fmtN(i.qty * i.price)); top += 1.5;
      });
    }
    rule();

    // Totals
    row('Subtotal', fmtN(sale.subtotal));
    if (sale.discount > 0) row('Discount', '-' + fmtN(sale.discount));
    if (sale.tax > 0) row(`Tax (${sale.taxRate}%)`, fmtN(sale.tax));
    rule(false);
    row(`Grand Total (${sale.currency})`, fmtN(sale.total), { bold: true, size: fs + 1.5 });
    rule(false);
    row('Cash', fmtN(sale.cash)); row('Balance', fmtN(sale.balance));

    // Footer + barcode placeholder
    top += lh * 0.6; center(st.footer, { bold: true }); need(44); top += 4;
    let x = 0; const bars = [];
    for (const ch of `*${sale.invoice}*`) { for (const bit of ch.charCodeAt(0).toString(2).padStart(8, '0')) { if (bit === '1') bars.push(x); x += 1; } x += 2; }
    const bw = Math.min(W - 2 * M, 150), sc = bw / x;
    bars.forEach((bx) => ops().push({ k: 'r', x: W / 2 - bw / 2 + bx * sc, y: top, w: Math.max(sc, 0.4), h: 26 }));
    top += 30; need(lh); put(sale.invoice, 0, { align: 'c' }); top += lh;
    return { pages, W, H: a4 ? PAGE_H : Math.ceil(top + M) };
  },

  /* Serialise drawing operations to PDF content stream text */
  stream(ops, H) {
    const f = (n) => n.toFixed(2);
    return ops.map((o) => {
      if (o.k === 't') return `BT /${o.bold ? 'F2' : 'F1'} ${f(o.size)} Tf ${f(o.x)} ${f(H - o.y)} Td (${Pdf.esc(o.s)}) Tj ET`;
      if (o.k === 'l') return `q ${f(o.w)} w ${o.dash ? '[2 2] 0 d' : ''} ${f(o.x1)} ${f(H - o.y)} m ${f(o.x2)} ${f(H - o.y)} l S Q`;
      if (o.k === 'r') return `${f(o.x)} ${f(H - o.y - o.h)} ${f(o.w)} ${f(o.h)} re f`;
      return `q ${f(o.w)} 0 0 ${f(o.h)} ${f(o.x)} ${f(H - o.y - o.h)} cm /Im1 Do Q`;
    }).join('\n');
  },

  /* Assemble the PDF file with a valid cross-reference table */
  build(sale, size, logo) {
    const { pages, W, H } = Pdf.layout(sale, size, logo);
    const enc = new TextEncoder(), chunks = [], offs = []; let off = 0;
    const push = (u8) => { chunks.push(u8); off += u8.length; };
    const str = (s) => push(enc.encode(s));
    const obj = (n, body) => { offs[n] = off; str(`${n} 0 obj\n${body}\nendobj\n`); };
    let next = logo ? 6 : 5; const pageNums = [], contentNums = [];
    pages.forEach(() => { pageNums.push(next++); contentNums.push(next++); });
    str('%PDF-1.4\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${pageNums.map((n) => `${n} 0 R`).join(' ')}] /Count ${pages.length} >>`);
    obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');
    obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>');
    if (logo) {
      offs[5] = off;
      str(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${logo.w} /Height ${logo.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${logo.bytes.length} >>\nstream\n`);
      push(logo.bytes); str('\nendstream\nendobj\n');
    }
    pages.forEach((ops, i) => {
      const content = Pdf.stream(ops, H);
      obj(pageNums[i], `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${logo ? ' /XObject << /Im1 5 0 R >>' : ''} >> /Contents ${contentNums[i]} 0 R >>`);
      obj(contentNums[i], `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    });
    const xref = off; let table = `xref\n0 ${next}\n0000000000 65535 f \n`;
    for (let n = 1; n < next; n++) table += `${String(offs[n]).padStart(10, '0')} 00000 n \n`;
    str(`${table}trailer\n<< /Size ${next} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }
};

async function downloadPdf(sale, size) {
  try {
    const blob = Pdf.build(sale, size, await Pdf.logoJpeg(S.settings.logo));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${sale.invoice}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    UI.toast(`${sale.invoice}.pdf downloaded`);
  } catch (e) { UI.toast('Could not create the PDF', 'error'); }
}

/* ==========================================================================
   8. SVG CHART HELPERS (attributes only, no inline styles)
   ========================================================================== */
function columnChart(items, h = 170) {
  const w = 640, base = h - 22, max = Math.max(...items.map((i) => i.value), 1), bw = w / items.length;
  const bars = items.map((it, idx) => {
    const bh = Math.round((it.value / max) * (base - 10));
    return `<rect x="${(idx * bw + 3).toFixed(1)}" y="${base - bh}" width="${(bw - 6).toFixed(1)}" height="${bh}" rx="3" class="fill-blue-900 dark:fill-blue-400"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>
      <text x="${(idx * bw + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle" class="fill-slate-500 text-[10px] dark:fill-slate-400">${esc(it.short ?? '')}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full" role="img" aria-label="Column chart"><line x1="0" y1="${base}" x2="${w}" y2="${base}" class="stroke-slate-300 dark:stroke-slate-600"/>${bars}</svg>`;
}

function rowChart(items) {
  if (!items.length) return '';
  const rowH = 30, w = 640, labelW = 150, barMax = 340, max = Math.max(...items.map((i) => i.value), 1);
  const rows = items.map((it, idx) => {
    const y = idx * rowH, bw = Math.max(2, Math.round((it.value / max) * barMax));
    return `<text x="0" y="${y + 19}" class="fill-slate-700 text-[12px] dark:fill-slate-200">${esc(it.label.slice(0, 22))}</text>
      <rect x="${labelW}" y="${y + 6}" width="${bw}" height="16" rx="5" class="fill-blue-900 dark:fill-blue-400"/>
      <text x="${labelW + bw + 8}" y="${y + 19}" class="fill-slate-500 text-[11px] dark:fill-slate-400">${fmtN(it.value)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${items.length * rowH}" class="w-full" role="img" aria-label="Bar chart">${rows}</svg>`;
}

const Cart = {
  refresh() { persist.cart(); if (S.view === 'pos') { Views.pos.cartItems(); Views.pos.totals(); } },
  add(id) {
    const p = S.products.find((x) => x.id === id); if (!p) return;
    const line = S.cart.find((l) => l.id === id), qty = (line ? line.qty : 0) + 1;
    if (!p.service && qty > p.stock) return UI.toast(`Only ${p.stock} of ${p.name} in stock`, 'warn');
    if (line) line.qty = qty;
    else S.cart.push({ id: p.id, name: p.name, sku: p.sku, price: p.price, cost: p.cost, category: p.category, qty: 1, service: p.service });
    Cart.refresh();
  },
  change(id, delta) {
    const line = S.cart.find((l) => l.id === id); if (!line) return;
    const p = S.products.find((x) => x.id === id), qty = line.qty + delta;
    if (qty <= 0) return Cart.remove(id);
    if (p && !p.service && qty > p.stock) return UI.toast(`Only ${p.stock} of ${p.name} in stock`, 'warn');
    line.qty = qty; Cart.refresh();
  },
  remove(id) { S.cart = S.cart.filter((l) => l.id !== id); Cart.refresh(); },
  reset() { S.cart = []; S.discount = { value: 0, type: 'amount' }; S.cash = ''; persist.cart(); if (S.view === 'pos') Views.pos.mount(); },

  complete() {
    if (!S.cart.length) return UI.toast('Add at least one item to the cart', 'warn');
    for (const l of S.cart) {
      const p = S.products.find((x) => x.id === l.id);
      if (!p) return UI.toast(`${l.name} no longer exists. Remove it from the cart.`, 'error');
      if (!p.service && l.qty > p.stock) return UI.toast(`Not enough stock for ${p.name} (${p.stock} left)`, 'error');
    }
    const t = Domain.totals();
    if (t.cash < t.total) return UI.toast(`Cash received is short by ${fmt(t.total - t.cash)}`, 'error');
    const sale = {
      id: uid(), invoice: nextInvoice(), date: new Date().toISOString(), cashier: S.settings.cashier,
      items: S.cart.map((l) => ({ ...l })), subtotal: t.subtotal, discount: t.discount, taxRate: S.settings.taxRate, tax: t.tax,
      total: t.total, cash: t.cash, balance: t.balance, profit: t.profit, currency: S.settings.currency
    };
    S.sales.unshift(sale);
    S.invoices.unshift({ invoice: sale.invoice, saleId: sale.id, date: sale.date, total: sale.total });
    S.counter += 1;
    Domain.adjustStock(sale.items, -1);
    persist.sales(); persist.invoices(); persist.counter(); Domain.rebuildReports();
    const lowItems = sale.items.map((i) => S.products.find((p) => p.id === i.id)).filter((p) => p && isLow(p));
    Cart.reset();
    openReceipt(sale.id, true);
    UI.toast(`Sale ${sale.invoice} saved`);
    if (lowItems.length) UI.toast(`Low stock: ${lowItems.map((p) => p.name).join(', ')}`, 'warn');
    updateHeader();
  }
};

/* ---------- Reports ---------- */
Views.reports = {
  title: 'Reports',
  render() {
    const tabs = [['today', 'Today'], ['week', 'Last 7 days'], ['month', 'This month']];
    return `
    <div class="mb-4 flex flex-wrap gap-2">${tabs.map(([k, l]) => `<button data-action="set-period" data-period="${k}" class="${C.btn} ${S.period === k ? C.primary : C.ghost}">${l}</button>`).join('')}</div>
    <div id="report-body"></div>`;
  },
  mount() {
    const sales = S.sales.filter((s) => Domain.inPeriod(s.date, S.period));
    const revenue = r2(sales.reduce((a, s) => a + s.total, 0)), profit = r2(sales.reduce((a, s) => a + s.profit, 0));
    const orders = sales.length, avg = orders ? r2(revenue / orders) : 0;
    const itemsSold = sales.reduce((a, s) => a + s.items.reduce((b, i) => b + i.qty, 0), 0);
    const stats = Domain.productStats(sales);
    const most = [...stats].sort((a, b) => b.qty - a.qty).slice(0, 5);
    const soldMap = new Map(stats.map((p) => [p.id, p.qty]));
    const least = S.products.map((p) => ({ name: p.name, qty: soldMap.get(p.id) || 0 })).sort((a, b) => a.qty - b.qty).slice(0, 5);
    const cat = {}; sales.forEach((s) => s.items.forEach((i) => { const k = i.category || 'Uncategorized'; cat[k] = r2((cat[k] || 0) + i.qty * i.price); }));
    const catItems = Object.entries(cat).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 8);
    const hours = Array.from({ length: 24 }, (_, h) => ({ label: `${pad(h)}:00`, short: h % 3 === 0 ? pad(h) : '', value: 0 }));
    sales.forEach((s) => { hours[new Date(s.date).getHours()].value += s.total; });
    const days = {}; sales.forEach((s) => { const k = dateKey(s.date); const d = days[k] || (days[k] = { orders: 0, revenue: 0, profit: 0 }); d.orders++; d.revenue += s.total; d.profit += s.profit; });
    const stat = (l, v) => `<div class="${C.card}"><div class="${C.muted} mb-1 font-semibold">${l}</div><div class="truncate text-xl font-bold">${v}</div></div>`;
    const list = (arr, unit) => arr.length ? arr.map((p) => `<div class="flex justify-between border-t border-slate-200/70 py-2 text-sm first:border-0 dark:border-slate-700/60"><span class="truncate pr-2">${esc(p.name)}</span><span class="shrink-0 font-semibold">${p.qty} ${unit}</span></div>`).join('') : emptyState('No data for this period.');
    $('#report-body').innerHTML = `
      <div class="grid grid-cols-2 gap-3 lg:grid-cols-5">${stat('Revenue', fmt(revenue))}${stat('Profit', fmt(profit))}${stat('Transactions', orders)}${stat('Average sale', fmt(avg))}${stat('Items sold', itemsSold)}</div>
      <div class="mt-4 grid gap-4 lg:grid-cols-2">
        <div class="${C.card}"><h2 class="${C.h2}">Hourly sales</h2>${orders ? columnChart(hours) : emptyState('No sales in this period.')}</div>
        <div class="${C.card}"><h2 class="${C.h2}">Category sales</h2>${catItems.length ? rowChart(catItems) : emptyState('No sales in this period.')}</div>
        <div class="${C.card}"><h2 class="${C.h2}">Most sold products</h2>${list(most, 'sold')}</div>
        <div class="${C.card}"><h2 class="${C.h2}">Least sold products</h2>${list(least, 'sold')}</div>
      </div>
      <div class="${C.card} mt-4 overflow-x-auto"><h2 class="${C.h2}">Daily breakdown</h2>
        ${Object.keys(days).length ? `<table class="w-full min-w-[420px] text-sm"><thead><tr><th class="${C.th}">Date</th><th class="${C.th} text-right">Orders</th><th class="${C.th} text-right">Revenue</th><th class="${C.th} text-right">Profit</th></tr></thead><tbody>
        ${Object.entries(days).sort((a, b) => b[0].localeCompare(a[0])).map(([k, d]) => `<tr class="${C.tr}"><td class="${C.td}">${fmtDate(k + 'T12:00:00')}</td><td class="${C.td} text-right">${d.orders}</td><td class="${C.td} text-right">${fmt(d.revenue)}</td><td class="${C.td} text-right">${fmt(d.profit)}</td></tr>`).join('')}</tbody></table>` : emptyState('No sales in this period.')}</div>`;
  }
};

  render() {
    let used = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); used += (k.length + (localStorage.getItem(k) || '').length) * 2; } } catch (e) { /* ignore */ }
    const card = (title, text, buttons) => `<div class="${C.card}"><h2 class="${C.h2}">${title}</h2><p class="mb-4 text-sm text-slate-600 dark:text-slate-300">${text}</p><div class="flex flex-wrap gap-2">${buttons}</div></div>`;
    return `
    <div class="grid gap-4 md:grid-cols-2">
      ${card('Products', `${S.products.length} products. Import merges with existing products (matching ID or SKU is updated).`,
        `<button data-action="export-products" class="${btn('primary')}">Export products JSON</button><button data-action="pick-file" data-target="file-products" class="${btn('ghost')}">Import products JSON</button>`)}
      ${card('Sales', `${S.sales.length} sales saved. Export a copy for your accounts.`,
        `<button data-action="export-sales" class="${btn('primary')}">Export sales JSON</button>`)}
      ${card('Full backup', 'Backs up products, sales, invoices, counters, reports and settings. Restoring replaces all current data.',
        `<button data-action="backup" class="${btn('primary')}">Backup complete system</button><button data-action="pick-file" data-target="file-restore" class="${btn('ghost')}">Restore backup</button>`)}
      ${card('Reset everything', 'Deletes all products, sales and settings from this browser. Make a backup first.',
        `<button data-action="reset-all" class="${btn('danger')}">Reset everything</button>`)}
    </div>
    <p class="${C.muted} mt-4">Browser storage used: about ${(used / 1024).toFixed(0)} KB. Most browsers allow around 5,000 KB, so back up regularly.</p>
    <input id="file-products" type="file" accept=".json,application/json" data-change="import-products" class="hidden">
    <input id="file-restore" type="file" accept=".json,application/json" data-change="restore" class="hidden">`;
  }
};

const download = (name, obj) => {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
};
const stamp = () => dateKey(new Date());

  'print-current': () => { const s = S.sales.find((x) => x.id === S.receipt?.id); if (s) printSale(s, S.receipt.size); },
  'download-pdf': () => { const s = S.sales.find((x) => x.id === S.receipt?.id); if (s) downloadPdf(s, S.receipt.size); },
  'pdf-sale': (t) => { const s = S.sales.find((x) => x.id === t.dataset.id); if (s) downloadPdf(s, S.settings.receiptSize); },

    const idx = S.sales.findIndex((s) => s.id === t.dataset.id); if (idx < 0) return;
    const sale = S.sales[idx];
    if (!(await UI.confirm({ title: 'Delete this sale?', message: `${sale.invoice} for ${fmt(sale.total)} will be removed and its items returned to stock.` }))) return;
    S.sales.splice(idx, 1); S.invoices = S.invoices.filter((i) => i.saleId !== sale.id);

      Domain.adjustStock(sale.items, -1); persist.sales(); persist.invoices(); Domain.rebuildReports();
      if (S.view === 'sales') Views.sales.table(); UI.toast('Sale restored');
    } });
  },

  'set-period': (t) => { S.period = t.dataset.period; go('reports'); },

  'export-sales': () => { download(`sales-${stamp()}.json`, { type: 'sales', exportedAt: new Date().toISOString(), sales: S.sales }); UI.toast('Sales exported'); },

const readImage = (file, max = 240) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onerror = reject;
  reader.onload = () => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

const readJSON = async (file) => {
  try { return JSON.parse(await file.text()); } catch (e) { UI.toast('That file is not valid JSON', 'error'); return null; }
};

const Forms = {
  product(f) {
    const id = f.dataset.id, g = (n) => f.elements[n].value.trim();
    const name = g('name'); if (!name) return UI.toast('Product name is required', 'error');
    const service = f.elements.service.checked;
    const sku = g('sku') || `SKU-${String(S.products.length + 1).padStart(4, '0')}-${Math.random().toString(36).slice(2, 4).toUpperCase()}`;
    const data = { name, category: g('category'), sku, barcode: g('barcode'), price: r2(num(g('price'))), cost: r2(num(g('cost'))),
      stock: service ? 0 : Math.max(0, Math.floor(num(g('stock')))), low: g('low') === '' ? 5 : Math.max(0, Math.floor(num(g('low')))), service, image: S.tempImage };
    const dup = S.products.find((p) => p.id !== id && ((p.sku && p.sku.toLowerCase() === sku.toLowerCase()) || (data.barcode && p.barcode === data.barcode)));
    if (dup) return UI.toast(`SKU or barcode already used by "${dup.name}"`, 'error');
    if (id) Object.assign(S.products.find((p) => p.id === id), data); else S.products.unshift({ id: uid(), ...data });
    persist.products(); UI.closeModal(); UI.toast(id ? 'Product updated' : 'Product added');
    if (S.view === 'products') Views.products.table(); if (S.view === 'pos') Views.pos.grid();
  },
  
  order(f) {
    const id = f.dataset.id;
    const g = name => f.elements[name].value.trim();

    const name = g('name');
    if (!name) {
      return UI.toast('Order name is required', 'error');
    }

    const priceValue = g('price');
    if (priceValue === '' || !Number.isFinite(Number(priceValue)) ||
        Number(priceValue) < 0) {
      return UI.toast('Enter a valid selling price', 'error');
    }

    let orderNo = g('sku');

    if (!orderNo) {
      let next = 1;
      do {
        orderNo = `ORD-${String(next++).padStart(5, '0')}`;
      } while (S.products.some(p =>
        p.isOrder && p.sku === orderNo
      ));
    }

    const duplicate = S.products.find(p =>
      p.isOrder &&
      p.id !== id &&
      p.sku.toLowerCase() === orderNo.toLowerCase()
    );

    if (duplicate) {
      return UI.toast('That order number is already in use', 'error');
    }

    const data = {
      name,
      category: '',
      sku: orderNo,
      barcode: g('barcode'),
      price: r2(Number(priceValue)),
      cost: 0,
      stock: 0,
      low: 0,
      service: true,
      image: S.tempImage || '',
      isOrder: true
    };

    if (id) {
      const existing = S.products.find(p =>
        p.id === id && p.isOrder
      );

      if (!existing) {
        return UI.toast('Order not found', 'error');
      }

      Object.assign(existing, data);
    } else {
      S.products.unshift({
        id: uid(),
        ...data
      });
    }

    persist.products();
    UI.closeModal();
    UI.toast(id ? 'Order updated' : 'Order added');

    if (S.view === 'orders') Views.orders.table();
    if (S.view === 'pos') Views.pos.grid();
  },
  category(f) {
    const name = f.elements.name.value.trim();
    if (!name) return;
    if (S.categories.some((c) => c.toLowerCase() === name.toLowerCase())) return UI.toast('That category already exists', 'warn');
    S.categories.push(name); persist.categories(); openCategoryModal(); UI.toast('Category added');
    if (S.view === 'products') go('products');
  },
  settings(f) {
    const g = (n) => f.elements[n].value.trim();
    if (!g('name')) return UI.toast('Company name is required', 'error');
    Object.assign(S.settings, { name: g('name'), address: g('address'), phone: g('phone'), cashier: g('cashier') || 'Admin', currency: g('currency') || 'LKR',
      taxRate: Math.min(100, Math.max(0, num(g('taxRate')))), invoicePrefix: g('invoicePrefix'), receiptSize: g('receiptSize'), footer: g('footer') });
    S.counter = Math.max(1, Math.floor(num(g('counter'))) || 1);
    persist.settings(); persist.counter(); updateHeader(); UI.toast('Settings saved');
  }
};

const FileInputs = {
  async logo(input) {
    const file = input.files[0]; if (!file) return;
    try { S.settings.logo = await readImage(file, 200); persist.settings(); updateHeader(); go('settings'); UI.toast('Logo updated'); }
    catch (e) { UI.toast('Could not read that image', 'error'); }
  },
  async 'product-image'(input) {
    const file = input.files[0]; if (!file) return;
    try { S.tempImage = await readImage(file, 240); const img = $('#product-image-preview'); img.src = S.tempImage; img.classList.remove('hidden'); }
    catch (e) { UI.toast('Could not read that image', 'error'); }
  },
  async 'order-image'(input) {
    const file = input.files?.[0];
    if (!file) return;
  
    if (!file.type.startsWith('image/')) {
      input.value = '';
      return UI.toast('Please select an image file', 'error');
    }
  
    try {
      const image = await readImage(file, 240);
  
      S.tempImage = image;
  
      const preview = $('#order-image-preview');
  
      if (preview) {
        preview.src = image;
        preview.classList.remove('hidden');
      }
    } catch (error) {
      console.error('Order image upload failed:', error);
      UI.toast('Could not read that image', 'error');
    }
  },
  async 'import-products'(input) {
    const file = input.files[0]; input.value = ''; if (!file) return;
    const json = await readJSON(file); if (!json) return;
    const list = Array.isArray(json) ? json : json.products;
    if (!Array.isArray(list)) return UI.toast('No products found in this file', 'error');
    let added = 0, updated = 0;
    list.forEach((raw) => {
      if (!raw || !raw.name) return;
      const item = { id: raw.id || uid(), name: String(raw.name), category: raw.category || '', sku: raw.sku || '', barcode: raw.barcode || '', price: r2(num(raw.price)),
        cost: r2(num(raw.cost)), stock: Math.max(0, Math.floor(num(raw.stock))), low: raw.low === undefined ? 5 : Math.floor(num(raw.low)), service: !!raw.service, image: raw.image || '' };
      const existing = S.products.find((p) => p.id === item.id || (item.sku && p.sku === item.sku));
      if (existing) { Object.assign(existing, item, { id: existing.id }); updated++; } else { S.products.push(item); added++; }
      if (item.category && !S.categories.includes(item.category)) S.categories.push(item.category);
    });
    persist.products(); persist.categories(); UI.toast(`Imported: ${added} added, ${updated} updated`); go('data');
  },
  async restore(input) {
    const file = input.files[0]; input.value = ''; if (!file) return;
    const json = await readJSON(file); if (!json) return;
    if (!json.data || json.app !== 'thilak-pos') return UI.toast('This is not a backup from this POS', 'error');
    if (!(await UI.confirm({ title: 'Restore backup?', message: 'All current data will be replaced with the backup contents.', confirmText: 'Restore', kind: 'primary' }))) return;
    KEYS.forEach((k) => { if (json.data[k] !== null && json.data[k] !== undefined) Store.set(k, json.data[k]); });
    Store.set('seeded', true); localStorage.removeItem('cart');
    loadState(); applyTheme(); updateHeader(); go('dashboard'); UI.toast('Backup restored');
  },
  'receipt-size'(select) {
    S.receipt.size = select.value;
    const sale = S.sales.find((s) => s.id === S.receipt.id);
    $('#receipt-preview').innerHTML = receiptHTML(sale, S.receipt.size);
  }
};

/* Barcode / Enter handling in the POS search box */
function handlePosEnter() {
  const term = S.posSearch.trim().toLowerCase(); if (!term) return;
  const exact = S.products.find((p) => (p.barcode && p.barcode.toLowerCase() === term) || (p.sku && p.sku.toLowerCase() === term));
  const matches = Views.pos.filtered();
  const hit = exact || (matches.length === 1 ? matches[0] : null);
  if (!hit) return UI.toast(matches.length ? 'Several products match. Tap the one you want.' : 'No product found for that code', 'warn');
  Cart.add(hit.id); S.posSearch = ''; $('#pos-search').value = ''; Views.pos.grid();
}

/* ==========================================================================
   14. GLOBAL EVENT WIRING
   ========================================================================== */
document.addEventListener('click', (e) => {
  if (e.target.id === 'modal') return UI.closeModal();
  const t = e.target.closest('[data-action]');
  if (t && Actions[t.dataset.action]) Actions[t.dataset.action](t, e);
});
document.addEventListener('input', (e) => { const k = e.target.dataset?.input; if (k && Inputs[k]) Inputs[k](e.target); });
document.addEventListener('change', (e) => {
  const input = e.target.dataset?.input; if (input && Inputs[input] && e.target.tagName === 'SELECT') return Inputs[input](e.target);
  const k = e.target.dataset?.change; if (k && FileInputs[k]) FileInputs[k](e.target);
});
document.addEventListener('submit', (e) => {
  const k = e.target.dataset?.form; if (!k || !Forms[k]) return;
  e.preventDefault(); Forms[k](e.target);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'pos-search') { e.preventDefault(); return handlePosEnter(); }
  if (e.key === 'Escape') return UI.closeModal();
  if (e.altKey && /^[1-7]$/.test(e.key)) { e.preventDefault(); return go(NAV[Number(e.key) - 1][0]); }
  const modalOpen = !$('#modal').classList.contains('hidden');
  if (modalOpen) return;
  const map = {
    F2: () => { if (S.view !== 'pos') go('pos'); $('#pos-search')?.focus(); },
    F4: () => { if (S.view !== 'pos') go('pos'); $('#cash-input')?.focus(); },
    F9: () => { if (S.view === 'pos') Cart.complete(); },
    F10: () => { if (S.view === 'pos') Actions['clear-cart'](); }
  };
  if (map[e.key]) { e.preventDefault(); map[e.key](); }
});

/* ==========================================================================
   15. INITIALISATION
   ========================================================================== */
function seedDefaults() {
  S.categories = ['Shirts', 'Trousers', 'Suits', 'Alterations', 'Fabrics', 'Accessories'];
  const mk = (name, category, price, cost, stock, service, sku) => ({ id: uid(), name, category, sku, barcode: '', price, cost, stock, low: 5, service, image: '' });
  S.products = [
    mk('Shirt stitching', 'Shirts', 2500, 1200, 0, true, 'SRV-001'),
    mk('Trouser stitching', 'Trousers', 2800, 1400, 0, true, 'SRV-002'),
    mk('Suit stitching', 'Suits', 18000, 9000, 0, true, 'SRV-003'),
    mk('Hem alteration', 'Alterations', 600, 200, 0, true, 'SRV-004'),
    mk('Cotton fabric (per metre)', 'Fabrics', 1200, 800, 100, false, 'FAB-001'),
    mk('Button pack', 'Accessories', 150, 60, 50, false, 'ACC-001'),
    mk('Zipper', 'Accessories', 120, 50, 40, false, 'ACC-002')
  ];
  persist.products(); persist.categories(); Store.set('seeded', true);
}

function loadState() {
  S.settings = { ...DEFAULT_SETTINGS, ...Store.get('companySettings', {}) };
  if (!Store.get('seeded', false) && Store.get('products', null) === null) seedDefaults();
  S.products = Store.get('products', []);
  S.categories = Store.get('categories', []);
  S.sales = Store.get('sales', []);
  S.invoices = Store.get('invoices', []);
  S.counter = Math.max(1, Number(Store.get('invoiceCounter', 1)) || 1);
  S.theme = Store.get('theme', 'light') === 'dark' ? 'dark' : 'light';
  const cart = Store.get('cart', []);
  S.cart = Array.isArray(cart) ? cart.filter((l) => S.products.some((p) => p.id === l.id)) : [];
  S.discount = { value: 0, type: 'amount' }; S.cash = '';
  Domain.rebuildReports();
  persist.settings();
}

function init() {
  loadState(); applyTheme(); updateHeader(); tickClock(); setInterval(tickClock, 30000);
  const start = location.hash.replace('#', '');
  go(Views[start] ? start : 'dashboard');
  setTimeout(() => { const s = $('#splash'); s.classList.add('opacity-0'); setTimeout(() => s.classList.add('hidden'), 500); }, 350);
}
init();
})();
</script>
